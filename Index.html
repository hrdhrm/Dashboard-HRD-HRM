<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Register PP — Hartono Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#12141C;
    --ink-soft:#6B7280;
    --ink-faint:#9AA1AE;
    --bg:#F3F5F9;
    --card:#FFFFFF;
    --line:#E6E9F0;
    --line-soft:#EEF0F6;
    --amber:#F2711F;
    --amber-dark:#C6570F;
    --amber-tint:#FDEADA;
    --teal:#0EA5A0;
    --teal-dark:#0B7D79;
    --teal-tint:#D9F3F1;
    --danger:#DC4C3F;
    --radius-lg:16px;
    --radius-md:11px;
    --radius-sm:8px;
    --shadow-sm:0 1px 2px rgba(15,23,42,0.05);
    --shadow-md:0 10px 30px -12px rgba(15,23,42,0.18);
    --shadow-btn:0 6px 16px -6px rgba(242,113,31,0.45);
    --font-display:'Sora', 'Inter', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;color:var(--ink);font-family:var(--font-body);background:var(--bg);}
  #root{min-height:100vh;display:flex;}
  ::selection{background:var(--amber-tint);color:var(--amber-dark);}
  a,button,input,select,textarea{font-family:inherit;}
  button{cursor:pointer;}
  *:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:256px;flex-shrink:0;background:var(--ink);color:#F3F5F9;
    display:flex;flex-direction:column;padding:28px 0 22px;
  }
  .brand{padding:0 24px 22px;}
  .brand-title{
    font-family:var(--font-display);font-size:17px;font-weight:700;line-height:1.3;
    margin:0 0 4px;letter-spacing:-0.01em;
  }
  .brand-sub{font-size:12px;color:#8A90A0;margin:0;}

  .tabs{padding:14px 12px;display:flex;flex-direction:column;gap:4px;}
  .tab-btn{
    display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:var(--radius-md);
    background:transparent;border:none;color:#B7BCC9;font-family:var(--font-body);
    font-size:14px;font-weight:500;text-align:left;cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  .tab-btn:hover{background:rgba(255,255,255,0.06);color:#F3F5F9;}
  .tab-btn.active{background:rgba(255,255,255,0.1);color:#FFFFFF;}
  .tab-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(255,255,255,0.08);}
  .dot-rust{background:var(--amber);}
  .dot-teal{background:var(--teal);}
  .tab-btn.active .dot-rust{background:var(--amber);}
  .tab-btn.active .dot-teal{background:var(--teal);}
  .tab-count{margin-left:auto;font-family:var(--font-mono);font-size:11.5px;color:#7C8294;}
  .tab-btn.active .tab-count{color:#C7CBD6;}

  .side-note{
    margin-top:auto;padding:18px 24px 0;font-size:11.5px;line-height:1.65;color:#6E7486;
  }

  /* ---------- Main ---------- */
  main{flex:1;padding:40px clamp(20px,4vw,48px);max-width:980px;min-width:0;}
  .top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px;}
  .cat-title{
    font-family:var(--font-display);font-size:clamp(21px,3vw,25px);font-weight:700;margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .cat-desc{font-size:13.5px;color:var(--ink-soft);margin:0;max-width:52ch;}

  .stats{display:flex;gap:14px;margin-bottom:24px;flex-wrap:wrap;}
  .stat-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:16px 20px;min-width:140px;flex:1;box-shadow:var(--shadow-sm);
  }
  .stat-label{font-size:11.5px;color:var(--ink-soft);margin:0 0 6px;}
  .stat-value{font-family:var(--font-mono);font-size:20px;font-weight:600;margin:0;}

  .toolbar{display:flex;gap:12px;margin-bottom:20px;align-items:center;flex-wrap:wrap;}
  .search-wrap{position:relative;flex:1;min-width:200px;}
  .search-wrap input{
    width:100%;padding:12px 14px 12px 40px;border-radius:var(--radius-md);border:1px solid var(--line);
    background:var(--card);font-family:var(--font-body);font-size:13.5px;color:var(--ink);
    box-shadow:var(--shadow-sm);transition:border-color .15s, box-shadow .15s;
  }
  .search-wrap input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-tint);}
  .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-faint);pointer-events:none;}
  .add-btn{
    display:flex;align-items:center;gap:8px;padding:12px 20px;border-radius:var(--radius-md);border:none;
    background:var(--amber);color:#FFFFFF;font-family:var(--font-body);font-size:13.5px;font-weight:600;
    cursor:pointer;white-space:nowrap;box-shadow:var(--shadow-btn);
    transition:background .15s, transform .1s, box-shadow .15s;
  }
  .add-btn:hover{background:var(--amber-dark);transform:translateY(-1px);box-shadow:0 10px 22px -8px rgba(242,113,31,0.55);}
  .add-btn:active{transform:translateY(0) scale(0.98);}
  .add-btn svg{width:15px;height:15px;}

  .export-btn{
    display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:var(--radius-md);
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-family:var(--font-body);
    font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow-sm);
    transition:background .15s, border-color .15s, color .15s, transform .1s;
  }
  .export-btn:hover{background:var(--teal-tint);border-color:var(--teal);color:var(--teal-dark);}
  .export-btn:active{transform:scale(0.98);}
  .export-btn svg{width:15px;height:15px;}

  /* ---------- Form card ---------- */
  .form-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:24px clamp(18px,3vw,28px);margin-bottom:22px;box-shadow:var(--shadow-md);
    animation:rise .2s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes rise{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
  .form-title{font-family:var(--font-display);font-size:16px;font-weight:700;margin:0 0 18px;letter-spacing:-0.01em;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:500;color:var(--ink-soft);margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;padding:11px 13px;border-radius:var(--radius-sm);border:1px solid var(--line);
    background:#FBFCFE;font-family:var(--font-body);font-size:13.5px;color:var(--ink);
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-tint);background:#fff;
  }
  .field-full{grid-column:1 / -1;}
  .preview-row{
    display:flex;align-items:center;gap:10px;padding:13px 15px;background:var(--amber-tint);
    border-radius:var(--radius-md);margin-bottom:14px;font-family:var(--font-mono);font-size:14.5px;
    font-weight:600;color:var(--amber-dark);
  }
  .preview-label{font-family:var(--font-body);font-weight:500;font-size:11.5px;color:var(--ink-soft);}
  .checkbox-row{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-soft);margin-bottom:14px;}
  .checkbox-row input{width:16px;height:16px;accent-color:var(--amber);}
  .form-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
  .btn-secondary{
    padding:11px 18px;border-radius:var(--radius-sm);border:1px solid var(--line);background:#fff;
    font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--ink-soft);cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .btn-secondary:hover{background:var(--line-soft);border-color:var(--ink-faint);}
  .btn-primary{
    padding:11px 20px;border-radius:var(--radius-sm);border:none;background:var(--amber);color:#fff;
    font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer;
    box-shadow:var(--shadow-btn);transition:background .15s, transform .1s;
  }
  .btn-primary:hover{background:var(--amber-dark);}
  .btn-primary:active{transform:scale(0.97);}
  .error-text{color:var(--danger);font-size:12px;margin:4px 0 0;}

  /* ---------- Ledger list ---------- */
  .ledger{display:flex;flex-direction:column;gap:10px;}
  .stub{
    position:relative;display:flex;align-items:stretch;background:var(--card);
    border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;
    box-shadow:var(--shadow-sm);transition:box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  .stub:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:#DADFEA;}
  .stub-no{
    width:64px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-size:14px;font-weight:600;color:var(--ink-faint);
    background:var(--line-soft);
  }
  .stub-body{flex:1;padding:15px 20px;display:flex;flex-direction:column;gap:6px;min-width:0;}
  .stub-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .stub-num{font-family:var(--font-mono);font-size:14.5px;font-weight:600;color:var(--amber-dark);}
  .stub-num.mat{color:var(--teal-dark);}
  .stub-divisi{
    font-size:11.5px;font-weight:600;padding:3px 11px;border-radius:999px;letter-spacing:0.1px;
    background:var(--amber-tint);color:var(--amber-dark);
  }
  .stub-divisi.mat{background:var(--teal-tint);color:var(--teal-dark);}
  .stub-pemohon{font-size:13px;font-weight:600;color:var(--ink);margin:0;}
  .stub-ket{font-size:13px;color:var(--ink-soft);line-height:1.5;}
  .stub-actions{display:flex;align-items:center;gap:2px;padding:0 12px;flex-shrink:0;}
  .icon-btn{
    width:32px;height:32px;border:none;background:transparent;border-radius:var(--radius-sm);cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--ink-faint);
    transition:background .15s, color .15s;
  }
  .icon-btn:hover{background:var(--line-soft);color:var(--ink);}
  .icon-btn svg{width:15px;height:15px;}

  .empty{
    text-align:center;padding:56px 20px;background:var(--card);border:1px dashed var(--line);
    border-radius:var(--radius-lg);
  }
  .empty-title{font-family:var(--font-display);font-size:16.5px;font-weight:700;margin:0 0 8px;}
  .empty-desc{font-size:13px;color:var(--ink-soft);margin:0 0 18px;}

  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#F3F5F9;padding:12px 22px;border-radius:999px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;font-family:var(--font-body);
    box-shadow:var(--shadow-md);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  /* ---------- Responsive ---------- */
  @media (max-width:900px){
    main{padding:32px 28px;}
  }

  @media (max-width:760px){
    #root{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;align-items:center;padding:14px 16px;gap:14px;}
    .brand{border:none;padding:0;flex-shrink:0;}
    .brand-sub{display:none;}
    .tabs{flex-direction:row;padding:0;flex:1;gap:4px;}
    .tab-btn{padding:10px 12px;}
    .side-note{display:none;}
    main{padding:24px 18px;}
    .top-row{margin-bottom:18px;}
    .stats{margin-bottom:18px;}
    .stat-card{min-width:0;padding:13px 15px;}
    .form-grid{grid-template-columns:1fr;}
    .stub{flex-direction:column;}
    .stub-no{width:100%;padding:6px 0;font-size:12px;}
    .stub-body{padding:14px 16px;}
    .stub-actions{padding:8px 16px 14px;justify-content:flex-end;}
    .toolbar{gap:10px;}
    .add-btn{flex:1;justify-content:center;}
  }

  @media (max-width:480px){
    .brand-title{font-size:15.5px;}
    .cat-title{font-size:20px;}
    .stats{flex-direction:column;}
    .form-actions{justify-content:stretch;}
    .form-actions button{flex:1;}
  }

  @media (prefers-reduced-motion: reduce){
    .form-card{animation:none;}
    .stub{transition:none;}
    .toast{transition:none;}
    .add-btn{transition:none;}
  }
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
const ROMAN = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];

const CATEGORIES = {
  tiket: {
    key: "pp:tiket:entries",
    label: "PP Tiket",
    desc: "Nomor permohonan dana untuk tiket dan operasional harian.",
    numLabel: "Nomor PP Tiket",
    kodeDefault: "TKT/HRM-HRD",
    seed: [
      {divisi:"PURCHASING", nomor:"001/GS-RKA/I/2023", ket:"Untuk Kontruksi Mes RKA"},
      {divisi:"GS-PURCHASING", nomor:"002/GS-RKA/I/2023", ket:"NP Hutang Toko"},
      {divisi:"GS-PURCHASING", nomor:"003/GS-RKA/I/2023", ket:"NP Hutang Toko"},
      {divisi:"GS-IT", nomor:"004-NP/GS-RKA/I/2023", ket:"NP IT PT Net Grup Multimedia"},
      {divisi:"GS-SECURITY", nomor:"005/GS-RKA-SEC/II/2023", ket:"NP Pembayaran Honor POLAIR"},
      {divisi:"NP-IT", nomor:"006-NP/GS-RKA/II/2023", ket:"NP Pembayaran IT Net Grup Multimedia Februari 2023"},
      {divisi:"NP Hutang Toko", nomor:"007/GS/RKA/II/2023", ket:"NP & Hutang Toko 25 Januari - 26 Februari 2023"}
    ]
  },
  material: {
    key: "pp:material:entries",
    label: "PP Material HR",
    desc: "Nomor permohonan dana untuk material dan kebutuhan HR.",
    numLabel: "Nomor PP Material",
    kodeDefault: "PP/HR",
    seed: []
  }
};

let state = { tiket: null, material: null };
let active = "tiket";
let search = "";
let formOpen = false;
let editingId = null;
let formError = "";

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadCategory(catKey){
  const cfg = CATEGORIES[catKey];
  try{
    const res = await window.storage.get(cfg.key, true);
    state[catKey] = res ? JSON.parse(res.value) : [];
  }catch(e){
    state[catKey] = cfg.seed.map(x => ({ id: uid(), ...x }));
    try{ await window.storage.set(cfg.key, JSON.stringify(state[catKey]), true); }catch(e2){}
  }
  render();
}

async function persist(catKey){
  try{
    await window.storage.set(CATEGORIES[catKey].key, JSON.stringify(state[catKey]), true);
  }catch(e){
    showToast("Gagal menyimpan. Coba lagi.");
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

function parseSeq(nomor){
  const m = /^(\d+)/.exec(nomor || "");
  return m ? parseInt(m[1],10) : 0;
}

function nextSeq(catKey){
  const list = state[catKey] || [];
  if(list.length === 0) return 1;
  return Math.max(...list.map(e => parseSeq(e.nomor))) + 1;
}

function buildAutoNumber(catKey){
  const cfg = CATEGORIES[catKey];
  const seq = nextSeq(catKey);
  const seqStr = String(seq).padStart(3,'0');
  const d = new Date();
  const roman = ROMAN[d.getMonth()];
  const year = d.getFullYear();
  return `${seqStr}/${cfg.kodeDefault}/${roman}/${year}`;
}

function switchTab(cat){
  active = cat; search = ""; formOpen = false; editingId = null; formError = "";
  render();
}

function openAddForm(){
  formOpen = true; editingId = null; formError = "";
  render();
  setTimeout(()=>{ const el = document.getElementById('f-nomor'); if(el){ el.focus(); el.select(); } }, 30);
}

function closeForm(){
  formOpen = false; editingId = null; formError = "";
  render();
}

async function submitForm(e){
  e.preventDefault();
  const nomor = document.getElementById('f-nomor').value.trim();
  const pemohon = document.getElementById('f-pemohon').value.trim();
  const ket = document.getElementById('f-ket').value.trim();

  if(!nomor || !pemohon || !ket){
    formError = "Nomor PP, nama pemohon, dan alasan pengajuan wajib diisi.";
    render();
    return;
  }

  const dup = state[active].some(x => x.nomor === nomor && x.id !== editingId);
  if(dup){
    formError = "Nomor PP ini sudah dipakai. Gunakan nomor lain.";
    render();
    return;
  }

  if(editingId){
    const idx = state[active].findIndex(x => x.id === editingId);
    if(idx > -1) state[active][idx] = { ...state[active][idx], nomor, pemohon, ket };
    showToast("Perubahan disimpan");
  }else{
    state[active].push({ id: uid(), nomor, pemohon, ket });
    showToast("PP baru ditambahkan");
  }
  await persist(active);
  formOpen = false; editingId = null; formError = "";
  render();
}

function startEdit(id){
  editingId = id; formOpen = true; formError = "";
  render();
}

async function removeEntry(id){
  const entry = state[active].find(x => x.id === id);
  if(!entry) return;
  if(!window.confirm(`Hapus nomor PP ${entry.nomor}? Tindakan ini tidak bisa dibatalkan.`)) return;
  state[active] = state[active].filter(x => x.id !== id);
  await persist(active);
  showToast("PP dihapus");
  render();
}

function copyNomor(nomor){
  navigator.clipboard?.writeText(nomor).then(()=> showToast("Nomor disalin: " + nomor)).catch(()=>{});
}

function renderForm(){
  const cfg = CATEGORIES[active];
  const editEntry = editingId ? state[active].find(x => x.id === editingId) : null;
  const suggested = editEntry ? editEntry.nomor : buildAutoNumber(active);

  return `
  <div class="form-card">
    <p class="form-title">${editEntry ? "Edit nomor PP" : "Tambah nomor PP baru"}</p>
    <form id="pp-form">
      <div class="field field-full" style="margin-bottom:14px;">
        <label for="f-nomor">${cfg.numLabel}</label>
        <input id="f-nomor" value="${escapeHtml(suggested)}" placeholder="Contoh: 009/TKT/HRM-HRD/VIII/2026" />
        ${!editEntry ? `<p style="font-size:11.5px;color:var(--ink-soft);margin:6px 0 0;">Nomor urut terisi otomatis — bagian lain bisa diedit langsung di sini kalau perlu.</p>` : ''}
      </div>

      <div class="field field-full" style="margin-bottom:14px;">
        <label for="f-pemohon">Nama Pemohon</label>
        <input id="f-pemohon" placeholder="Contoh: Irsan Nasri" value="${editEntry ? escapeHtml(editEntry.pemohon || '') : ''}" />
      </div>

      <div class="field field-full" style="margin-bottom:6px;">
        <label for="f-ket">Alasan Pengajuan</label>
        <textarea id="f-ket" rows="2" placeholder="Untuk keperluan apa nomor ini dipakai">${editEntry ? escapeHtml(editEntry.ket) : ''}</textarea>
      </div>

      ${formError ? `<p class="error-text">${escapeHtml(formError)}</p>` : ''}

      <div class="form-actions" style="margin-top:14px;">
        <button type="button" class="btn-secondary" onclick="closeForm()">Batal</button>
        <button type="submit" class="btn-primary">${editEntry ? "Simpan perubahan" : "Tambah PP"}</button>
      </div>
    </form>
  </div>`;
}

function render(){
  const root = document.getElementById('root');
  const cfg = CATEGORIES[active];
  const list = state[active] || [];
  const filtered = search
    ? list.filter(x => (x.nomor+" "+(x.pemohon||"")+" "+x.ket).toLowerCase().includes(search.toLowerCase()))
    : list;
  const isTiket = active === 'tiket';
  const lastNomor = list.length ? list[list.length-1].nomor : "\u2014";

  root.innerHTML = `
    <div class="sidebar">
      <div class="brand">
        <p class="brand-title">Register PP</p>
        <p class="brand-sub">Hartono Group</p>
      </div>
      <div class="tabs">
        ${Object.entries(CATEGORIES).map(([key,c]) => `
          <button class="tab-btn ${active===key?'active':''}" onclick="switchTab('${key}')">
            <span class="tab-dot ${key==='tiket'?'dot-rust':'dot-teal'}"></span>
            <span>${c.label}</span>
            <span class="tab-count">${state[key] ? state[key].length : '\u2026'}</span>
          </button>
        `).join('')}
      </div>
      <p class="side-note">Setiap nomor PP wajib mengikuti urutan yang berjalan. Data tersimpan otomatis dan terlihat oleh semua yang membuka register ini.</p>
    </div>

    <main>
      <div class="top-row">
        <div>
          <p class="cat-title">${cfg.label}</p>
          <p class="cat-desc">${cfg.desc}</p>
        </div>
      </div>

      <div class="stats">
        <div class="stat-card">
          <p class="stat-label">Total nomor tercatat</p>
          <p class="stat-value">${list.length}</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Nomor terakhir</p>
          <p class="stat-value">${escapeHtml(lastNomor)}</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Urutan berikutnya</p>
          <p class="stat-value">${String(nextSeq(active)).padStart(3,'0')}</p>
        </div>
      </div>

      <div class="toolbar">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input placeholder="Cari nomor atau keterangan" value="${escapeHtml(search)}" oninput="onSearch(this.value)" />
        </div>
        <button class="export-btn" onclick="exportToExcel()" title="Export register ke file Excel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9.5 13.5l5 5M14.5 13.5l-5 5"/></svg>
          Export Excel
        </button>
        <button class="add-btn" onclick="openAddForm()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Tambah PP
        </button>
      </div>

      ${formOpen ? renderForm() : ''}

      ${filtered.length === 0 ? `
        <div class="empty">
          <p class="empty-title">${list.length===0 ? 'Belum ada nomor PP tercatat' : 'Tidak ada hasil yang cocok'}</p>
          <p class="empty-desc">${list.length===0 ? 'Mulai register dengan menambahkan nomor PP pertama untuk kategori ini.' : 'Coba kata kunci lain.'}</p>
          ${list.length===0 ? `<button class="add-btn" style="margin:0 auto;" onclick="openAddForm()">Tambah PP pertama</button>` : ''}
        </div>
      ` : `
        <div class="ledger">
          ${filtered.slice().reverse().map((entry) => {
            const originalIdx = list.findIndex(x=>x.id===entry.id);
            return `
            <div class="stub">
              <div class="stub-no">${String(originalIdx+1).padStart(2,'0')}</div>
              <div class="stub-body">
                <div class="stub-top">
                  <span class="stub-num ${isTiket?'':'mat'}">${escapeHtml(entry.nomor)}</span>
                </div>
                ${entry.pemohon ? `<p class="stub-pemohon">${escapeHtml(entry.pemohon)}</p>` : ''}
                <p class="stub-ket">${escapeHtml(entry.ket)}</p>
              </div>
              <div class="stub-actions">
                <button class="icon-btn" title="Salin nomor" onclick="copyNomor('${entry.nomor.replace(/'/g,"\\'")}')">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                </button>
                <button class="icon-btn" title="Edit" onclick="startEdit('${entry.id}')">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </button>
                <button class="icon-btn" title="Hapus" onclick="removeEntry('${entry.id}')">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
                </button>
              </div>
            </div>`;
          }).join('')}
        </div>
      `}
    </main>
  `;

  const form = document.getElementById('pp-form');
  if(form) form.addEventListener('submit', submitForm);
}

function onSearch(val){
  search = val;
  render();
}

function exportToExcel(){
  try{
    if(typeof XLSX === 'undefined'){
      showToast("Gagal memuat pustaka Excel. Periksa koneksi internet.");
      return;
    }

    const wb = XLSX.utils.book_new();
    let hasAnyData = false;

    Object.entries(CATEGORIES).forEach(([key, cfg]) => {
      const list = state[key] || [];
      if(list.length > 0) hasAnyData = true;

      const rows = list.map((entry, idx) => ({
        "No": idx + 1,
        [cfg.numLabel]: entry.nomor || "",
        "Nama Pemohon": entry.pemohon || "",
        "Alasan Pengajuan": entry.ket || ""
      }));

      const ws = XLSX.utils.json_to_sheet(
        rows.length ? rows : [{ "No": "", [cfg.numLabel]: "", "Nama Pemohon": "", "Alasan Pengajuan": "" }]
      );
      ws['!cols'] = [{ wch: 6 }, { wch: 34 }, { wch: 26 }, { wch: 44 }];

      // Sheet name max 31 chars, no special chars
      const sheetName = cfg.label.replace(/[\\/?*\[\]:]/g, '').slice(0, 31);
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
    });

    if(!hasAnyData){
      showToast("Belum ada data untuk diexport.");
      return;
    }

    const dateStr = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, `Register-PP-Hartono-Group-${dateStr}.xlsx`);
    showToast("Export ke Excel berhasil");
  }catch(e){
    showToast("Gagal export ke Excel. Coba lagi.");
  }
}

async function init(){
  root_loading();
  await Promise.all(Object.keys(CATEGORIES).map(loadCategory));
}

function root_loading(){
  document.getElementById('root').innerHTML = `<div style="padding:60px;font-family:Inter,sans-serif;color:#5B6474;">Memuat register PP...</div>`;
}

init();
</script>
</body>
</html>
